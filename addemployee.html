<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>
    <link rel="stylesheet" href="addemployee.css">
</head>

<body>
    <div class="registrationForm-container">
        <form id="registrationForm">
            <h4>EMPLOYEE REGISTRATION FORM</h4>
            <input type="number" id="employeeID" placeholder="Enter Employee Id" required>
            <input type="tel" id="phone" placeholder="Enter Mobile Number" required>
            <input type="text" id="NameInput" placeholder="Enter Name" required>
            <input type="age" id="age" placeholder="Enter Age" required>
            <input type="email" id="email" placeholder="Enter email@gmail.com" required>
            <input type="number" id="aadhar" placeholder="Enter Aadhar Number" required>
            <div class="bottomButton">
                <button type="submit">Add Employee</button>
                <button type="reset">Reset</button>
                <a href="dashboard.html">
                    <button type="button">Back To Dashboard</button>
                </a>
            </div>
        </form>
    </div>
</body>
<script src="addemployee.js"></script>

</html>
